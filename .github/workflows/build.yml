name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref_name }}-prod
  cancel-in-progress: true

env:
  DEPLOYMENT_TIMEOUT: 15m

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
    - name: Send Telegram notification - Start
      if: always()
      continue-on-error: true
      uses: appleboy/telegram-action@v1.0.1
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        format: html
        disable_web_page_preview: true
        message: |
          🚀 <b>Deployment Started</b>
          <blockquote>📦 Repository: ${{ github.repository }}
          🌿 Branch: ${{ github.ref_name }}
          👤 Author: ${{ github.actor }}
          💬 Commit message:
          ${{ github.event.head_commit.message }}</blockquote>
          🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"><b>Workflow</b></a>

    - name: Deploy to server
      id: deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        command_timeout: ${{ env.DEPLOYMENT_TIMEOUT }}
        script: |
          set -Eeuo pipefail
          trap 'echo "Error on line $LINENO"; exit 1' ERR

          echo "🚀 Starting deployment process..."
          START_TIME=$(date +%s)
          IMAGE=bot_v5-bot          # образ сервиса bot: <проект compose>-<сервис>
          WAIT=180                  # секунд на старт и healthcheck

          cd bot_v5 || exit 1
          echo "✅ Changed to bot_v5 directory"

          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "📌 Current commit: $CURRENT_COMMIT"

          echo "1. Pulling latest changes..."
          git fetch origin main
          git reset --hard origin/main
          NEW_COMMIT=$(git rev-parse HEAD)

          # Откат поднимает этот образ: после git reset без --build compose запустил бы только что собранный
          echo "2. Saving current image for rollback..."
          if docker image inspect "$IMAGE:latest" >/dev/null 2>&1; then
            docker tag "$IMAGE:latest" "$IMAGE:rollback"
          else
            echo "No previous image, rollback will not be possible"
          fi

          # Старая версия работает, пока собирается новая
          echo "3. Building..."
          if ! docker compose build; then
            echo "❌ Build failed, the old version keeps running"
            git reset --hard "$CURRENT_COMMIT"
            exit 1
          fi

          # --wait: compose ждёт running и healthy у всех сервисов с healthcheck, иначе код возврата не 0
          echo "4. Starting and waiting for healthy (up to ${WAIT}s)..."
          if docker compose up -d --wait --wait-timeout "$WAIT"; then
            END_TIME=$(date +%s)
            echo "✅ All services are up & healthy!"
            echo "🎉 Deployment completed in $((END_TIME - START_TIME))s!"
            echo "Old commit: $CURRENT_COMMIT"
            echo "New commit: $NEW_COMMIT"
            docker compose ps
            echo "==> Bot logs"
            docker compose logs --no-color --tail=200 bot || true
            docker image prune -f
            exit 0
          fi

          echo "❌ Health check failed! Rolling back..."
          docker compose ps || true
          echo "==> Bot logs"
          docker compose logs --no-color --tail=200 bot || true
          git reset --hard "$CURRENT_COMMIT"
          if docker image inspect "$IMAGE:rollback" >/dev/null 2>&1; then
            docker tag "$IMAGE:rollback" "$IMAGE:latest"
            if docker compose up -d --wait --wait-timeout "$WAIT"; then
              echo "↩️ Rolled back to $CURRENT_COMMIT"
            else
              echo "⚠️ The previous version is not healthy either, check the server"
            fi
          else
            echo "⚠️ No previous image to roll back to"
          fi
          exit 1

    - name: Send Telegram notification - Success
      if: success()
      continue-on-error: true
      uses: appleboy/telegram-action@v1.0.1
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        format: html
        disable_web_page_preview: true
        message: |
          ✅ <b>Deployment Successful</b>
          <blockquote>📦 Repository: ${{ github.repository }}
          🌿 Branch: ${{ github.ref_name }}
          👤 Author: ${{ github.actor }}
          💬 Commit message:
          ${{ github.event.head_commit.message }}</blockquote>
          🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"><b>Workflow</b></a>

    - name: Send Telegram notification - Failure
      if: failure()
      continue-on-error: true
      uses: appleboy/telegram-action@v1.0.1
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        format: html
        disable_web_page_preview: true
        message: |
          ❌ <b>Deployment Failed</b>
          <blockquote>📦 Repository: ${{ github.repository }}
          🌿 Branch: ${{ github.ref_name }}
          👤 Author: ${{ github.actor }}
          💬 Commit message:
          ${{ github.event.head_commit.message }}</blockquote>
          🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"><b>Workflow</b></a>