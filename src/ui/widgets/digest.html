<!doctype html><style>
:root{--tx:var(--tg-theme-text-color);--bg:var(--tg-theme-bg-color);--hn:var(--tg-theme-hint-color);--ac:var(--tg-theme-button-color);--s2:var(--tg-theme-secondary-bg-color);--ln:rgba(128,128,128,.32);--sf:rgba(128,128,128,.1);--g:#1f9d4b;--gl:rgba(31,157,75,.1);--o:#e08600;--r:#d23a31}

*{box-sizing:border-box;margin:0}

.hd{margin-bottom:12px}

.rw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.s{height:38px;border-radius:12px;border-bottom-left-radius:4px;border-bottom-right-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;padding:0 2px;font-size:12px;color:var(--tx)}

.tk,.bs{background:var(--bg);color:var(--hn)}

.r:after,.nt i{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:3px;background:var(--o)}
.o:only-child{height:22px}
.sp{align-self:center;width:18px;height:18px;border:2px solid;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hd .ok{color:var(--g)}.hd .er{color:var(--r)}
.nt{margin-top:10px;height:19px;font-size:13px;line-height:19px;color:var(--hn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt i{position:static;display:inline-block;margin:0 6px 1.5px 0}
.nt button{font-weight:500;color:var(--ac)}
</style><div id="a"></div><script>
var T=window.TelegramWidget||{},H=T.HapticFeedback,A=document.getElementById('a'),

C={s:[]},busy=0,ts=null,tt,nv=null,nt;

function cell(c){if(c[0]=='x')return'<div class="s o" style="grid-column:span '+c.slice(1)+'"></div>';if(c=='b')return B?'<div class="s bs" data-s="b">'+nm(B)+'</div>':'<div class="s o"></div>';
 var v=C.s[c-1];return'<div class="s '+(v?'tk'+(v[1]?'':' r'):C.x?'no':'fr')+'" data-s="'+c+'">'+(v?nm(v[0]):busy==c?'<i class="sp"></i>':'<em>'+(C.x?'':'занять')+'</em>')+'</div>'}

function map(){var h='';L.forEach(function(e,i){h+=pt(e)+(i==TOP?'<div class="or"><span>← Окно</span><span>Коридор →</span></div>':'')});return'<div class="mp">'+h+'</div>'}
function st(){var w=0,l;C.s.forEach(function(v){if(v&&!v[1])w++});
 l=ts&&ts.b?'<button data-l="1">'+(ts.b==2?'Зарегистрироваться':'Встать в очередь')+' в боте ›</button>':ts&&ts.h?esc(ts.h):C.x?'':w?'<i></i>Нажмите на своё место, чтобы подтвердить':C.f?'Нажмите на свободное место, чтобы занять':'Встать в очередь можно <button data-l="1">в боте ›</button>';
 return l?'<div class="nt">'+l+'</div>':''}

  if(j.n)fio(j.n);else if(j.m){toast(j);H&&H.notificationOccurred(j.e?'error':'success')}draw()},
