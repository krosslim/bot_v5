<!doctype html><style>
:root{--tx:var(--tg-theme-text-color,#000);--bg:var(--tg-theme-bg-color,#fff);--hn:var(--tg-theme-hint-color,#8e8e93);--ac:var(--tg-theme-button-color,#3390ec);--s2:var(--tg-theme-secondary-bg-color,#f1f1f4);--ln:rgba(128,128,128,.32);--sf:rgba(128,128,128,.1);--g:#1f9d4b;--gl:rgba(31,157,75,.1);--o:#e08600;--r:#d23a31;--nm:rgba(0,0,0,.72)}

*{box-sizing:border-box;margin:0}
body{font:14px/1.3 system-ui,sans-serif;color:var(--tx);padding:10px 10px max(12px,env(safe-area-inset-bottom))}

.mp{font-size:10px;color:var(--hn)}
.or{display:flex;justify-content:space-between;margin:12px 2px;font-size:11px}

.rm{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px}.rm:before,.rm:after{content:"";flex:1;height:1px;background:var(--ln)}

.tb{height:36px;margin:3px 0;border-radius:8px;background:var(--sf);text-align:center;line-height:36px;text-transform:uppercase;letter-spacing:.5px}
.rw{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.s{height:40px;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;padding:0 2px;overflow:hidden;font-size:12px;color:var(--tx)}
.s em{font-style:normal;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr{background:var(--gl);color:var(--g);font-weight:600}
.tk,.bs{background:var(--s2);color:var(--nm)}
.tk em,.bs em{white-space:normal;line-height:1.15}
.r:after,.nt i{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:3px;background:var(--o)}
.o:only-child{height:22px}
.sp{align-self:center;width:18px;height:18px;border:2px solid;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.nt{margin-top:8px;height:32px;line-height:16px;overflow:hidden}
.nt i{position:static;display:inline-block;margin:0 6px 1.5px 0}
.er{color:var(--r)}.ok b{color:var(--g)}.pn{color:var(--tx)}.nm{color:var(--nm)}
.nt button{font-weight:600;color:var(--ac)}
</style><div id="a"></div><script>
var T=window.TelegramWidget||{},H=T.HapticFeedback,A=document.getElementById('a'),
L=__LAYOUT__,TOP=__TOP__,B=__BOSS__,BOT=__BOT__,
C={s:[]},busy=0,ts=null,tt;

function cell(c){if(c[0]=='x')return'<div class="s o" style="grid-column:span '+c.slice(1)+'"></div>';if(c=='b')return'<div class="s bs">'+nm(B)+'</div>';
 var v=C.s[c-1];return'<button class="s '+(v?'tk'+(v[1]?'':' r'):C.x?'no':'fr')+'" data-s="'+c+'">'+(busy==c?'<i class="sp"></i>':v?nm(v[0]):'<em>'+(C.x?'':'занять')+'</em>')+'</button>'}

function map(){var h='';L.forEach(function(e,i){h+=pt(e)+(i==TOP?'<div class="or"><span>← Окно</span><span>Коридор →</span></div>':'')});return'<div class="mp">'+h+'</div>'}
function draw(){if(!C.d){A.innerHTML='';return}var n=0,w=0;C.s.forEach(function(v){if(v){n++;if(!v[1])w++}});
 A.innerHTML='<div class="hd"><b>'+esc(C.t)+'</b><small>занято '+n+' из '+C.s.length+'</small></div>'+
 map()+
 '<div class="nt'+(ts?' '+(ts.n?'nm':ts.e?'er':ts.ok?'ok':'pn'):'')+'">'+(ts?ts.n?esc(ts.n):(ts.ok?'<b>'+esc(ts.m)+'</b>'+(ts.h?'<br>'+esc(ts.h):''):esc(ts.m))+(ts.b?' <button data-l="1">Открыть бота ›</button>':''):C.x?'Бронирование закрыто':w?'<i></i>Нажмите на своё место, чтобы подтвердить бронь':n<C.s.length?'':'Мест нет, очередь в боте')+'</div>'}

  if(j.n||j.m){toast(j);H&&!j.n&&H.notificationOccurred(j.e?'error':'success')}draw()},
 function(x){busy=0;toast({m:/rate/i.test(x&&x.message)?'Слишком часто, подождите пару секунд':'Бот не ответил, попробуйте ещё раз',e:1});draw()})};
T.onEvent&&T.onEvent('themeChanged',th);

th();rd();draw();T.ready&&T.ready();
