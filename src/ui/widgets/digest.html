<!doctype html><style>
:root{--tx:var(--tg-theme-text-color,#000);--bg:var(--tg-theme-bg-color,#fff);--hn:var(--tg-theme-hint-color,#8e8e93);--ac:var(--tg-theme-button-color,#3390ec);--s2:var(--tg-theme-secondary-bg-color,#f1f1f4);--ln:rgba(128,128,128,.32);--sf:rgba(128,128,128,.1);--g:#1f9d4b;--gl:rgba(31,157,75,.1);--gr:rgba(31,157,75,.55);--o:#e08600}
.dk{--g:#4cd964;--gl:rgba(76,217,100,.12);--gr:rgba(76,217,100,.5);--o:#ffb340}
*{box-sizing:border-box;margin:0}
body{font:14px/1.3 system-ui,sans-serif;color:var(--tx);padding:10px 10px max(12px,env(safe-area-inset-bottom));position:relative}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
button:active{opacity:.6}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.hd b{font-size:16px}
small,.nt{font-size:12px;color:var(--hn)}
.mp{font-size:10px;color:var(--hn)}
.tp{padding:0 22px}.bd{display:flex;gap:4px}.gd{flex:1;min-width:0}
.rm,.o,.no{background:repeating-linear-gradient(135deg,transparent,transparent 4px,var(--sf) 4px,var(--sf) 8px)}
.rm{height:36px;margin-bottom:14px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--ln);display:flex;align-items:center;justify-content:center;font-size:12px}
.is{padding:5px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--ln)}
.is+.is{margin-top:14px}
.tb{height:36px;margin:4px 0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--ln);text-align:center;line-height:36px;text-transform:uppercase;letter-spacing:.5px}
.rw{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sd{width:18px;border-radius:6px;background:var(--sf);position:relative}
.sd span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap}
.s{height:40px;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;padding:0 5px;overflow:hidden;font-size:12px;color:var(--tx)}
.s em{font-style:normal;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr{background:var(--gl);box-shadow:inset 0 0 0 1.5px var(--gr);color:var(--g);font-weight:600}
.tk,.bs{background:var(--s2)}
.bs{color:var(--hn)}.bs em{white-space:normal;line-height:1.15}
.tk:after,.nt i{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:3px;background:var(--g)}
.tk.r:after,.nt i{background:var(--o)}
.o{height:auto;min-height:26px}
.sp{align-self:center;width:18px;height:18px;border:2px solid;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.nt{margin-top:8px;min-height:16px}
.nt i{position:static;display:inline-block;margin-right:6px;vertical-align:1px}
.ts{position:absolute;left:10px;right:10px;bottom:8px;padding:9px 12px;border-radius:12px;background:var(--tx);color:var(--bg);font-size:13px;display:flex;align-items:center;gap:10px}
.ts span{flex:1}
.ts button{font-weight:600;color:var(--ac)}
</style><div id="a"></div><script>
var T=window.TelegramWidget||{},H=T.HapticFeedback,A=document.getElementById('a'),
L=__LAYOUT__,TOP=__TOP__,B=__BOSS__,BOT=__BOT__,
C={s:[]},busy=0,ts=null,tt;
function esc(s){return String(s).replace(/[<>&"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function rd(){try{C=JSON.parse(T.chatData||'{}')}catch(e){}C.s=C.s||[]}
function th(){document.documentElement.className=T.colorScheme=='dark'?'dk':''}
function cell(c){if(c=='x')return'<div class="s o"></div>';if(c=='b')return'<div class="s bs"><em>'+esc(B)+'</em></div>';
 var v=C.s[c-1];return'<button class="s '+(v?'tk'+(v[1]?'':' r'):C.x?'no':'fr')+'" data-s="'+c+'">'+(busy==c?'<i class="sp"></i>':'<em>'+(v?esc(v[0]):C.x?'':'занять')+'</em>')+'</button>'}
function rw(r){var h='';r.forEach(function(c){h+=cell(c)});return h?'<div class="rw">'+h+'</div>':''}
function pt(e){return typeof e=='string'?'<div class="rm">'+esc(e)+'</div>':'<div class="is">'+rw(e[0])+'<div class="tb">'+esc(e[1])+'</div>'+rw(e[2])+'</div>'}
function map(){var a='',b='';L.forEach(function(e,i){if(i<TOP)a+=pt(e);else b+=pt(e)});
 return'<div class="mp"><div class="tp">'+a+'</div><div class="bd"><div class="sd"><span>Окно</span></div><div class="gd">'+b+'</div><div class="sd"><span>Коридор</span></div></div></div>'}
function draw(){if(!C.d){A.innerHTML='';return}var n=0,w=0;C.s.forEach(function(v){if(v){n++;if(!v[1])w++}});
 A.innerHTML='<div class="hd"><b>'+esc(C.t)+'</b><small>занято '+n+' из '+C.s.length+'</small></div>'+
 map()+
 '<div class="nt">'+(C.x?'Бронирование закрыто':w?'<i></i>Нажмите на своё место, чтобы подтвердить бронь':n<C.s.length?'':'Мест нет, очередь в боте')+'</div>'+
 (ts?'<div class="ts"><span>'+esc(ts.m)+'</span>'+(ts.b?'<button data-l="1">Открыть бота</button>':'')+'</div>':'')}
function toast(j){ts=j;clearTimeout(tt);tt=setTimeout(function(){ts=null;draw()},j.b?6000:3000)}
function g(n,k){return n.getAttribute&&n.getAttribute('data-'+k)}
document.onclick=function(e){var n=e.target;while(n&&n!=A&&!g(n,'s')&&!g(n,'l'))n=n.parentNode;
 if(!n||n==A||n.disabled)return;
 if(g(n,'l'))return T.openTelegramLink&&T.openTelegramLink('https://t.me/'+BOT+'?start=');
 if(busy||C.x)return;busy=g(n,'s');draw();
 T.request('s:'+C.d+':'+g(n,'s')).then(function(r){busy=0;var j={};try{j=JSON.parse(r.result)||{}}catch(x){}
  if(j.m){toast(j);H&&H.notificationOccurred(j.e?'error':'success')}draw()},
 function(x){busy=0;toast({m:/rate/i.test(x&&x.message)?'Слишком часто, подождите пару секунд':'Бот не ответил, попробуйте ещё раз',e:1});draw()})};
T.onEvent&&T.onEvent('themeChanged',th);
T.onEvent&&T.onEvent('chatDataChanged',function(){rd();draw()});
th();rd();draw();T.ready&&T.ready();
</script>
